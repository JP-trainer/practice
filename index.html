<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Japanese Reading Practice</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    min-height: 100%;
}

body {
    font-family: Arial, sans-serif;
    background: #f4f6f8;
    color: #222;
}

.app {
    width: min(600px, calc(100% - 20px));
    margin: 20px auto;
    padding: 22px;
    background: white;
    border-radius: 15px;
    box-shadow: 0 4px 20px rgba(0,0,0,.12);
    text-align: center;
}

h1 {
    margin: 0 0 22px;
    font-size: 28px;
}

.settings {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
    text-align: left;
}

label {
    font-weight: bold;
    display: block;
    margin-bottom: 6px;
}

select,
input[type="number"],
input[type="text"] {
    width: 100%;
    padding: 10px;
    font-size: 16px;
    border: 1px solid #bbb;
    border-radius: 8px;
    background: white;
}

.display {
    margin: 25px 0 15px;
    min-height: 220px;
    height: 220px;
    padding: 20px;

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;

    background: #fafafa;
    border: 2px solid #ddd;
    border-radius: 12px;

    overflow: hidden;
}

#character {
    font-size: 75px;
    font-weight: bold;
    line-height: 1.1;
    max-width: 100%;
    white-space: nowrap;
    text-align: center;
}

#correctAnswer {
    min-height: 30px;
    margin-top: 12px;
    font-size: 24px;
    font-weight: bold;
    color: #22a447;
}

#translation {
    min-height: 25px;
    margin-top: 5px;
    font-size: 18px;
    color: #555;
}

#inputArea {
    display: none;
    margin-bottom: 18px;
}

#answer {
    width: 100%;
    text-align: center;
    font-size: 24px;
    padding: 11px;

    transition:
        background-color .2s,
        border-color .2s;

    touch-action: manipulation;
}

#answer.correct {
    background-color: #8be28b;
    border-color: #38a838;
}

#answer.incorrect {
    background-color: #ff9b9b;
    border-color: #d33;
}

.buttons {
    display: flex;
    gap: 10px;
    justify-content: center;
}

button {
    padding: 12px 30px;
    font-size: 17px;
    border: 0;
    border-radius: 8px;
    cursor: pointer;
}

#startButton {
    background: #2878e3;
    color: white;
}

#startButton.stop {
    background: #d83b3b;
}

button:hover {
    opacity: .85;
}

.status {
    display: flex;
    justify-content: space-between;
    margin-top: 20px;
    padding: 12px;
    background: #f0f0f0;
    border-radius: 8px;
    font-size: 16px;
}


/* ============================================================
   MOBILE
   ============================================================ */

@media (max-width: 500px) {

    html,
    body {
        width: 100%;
        min-height: 100%;
    }

    body {
        display: flex;
        justify-content: center;
        align-items: flex-start;
        overflow-x: hidden;
    }

    .app {
        width: calc(100% - 16px);
        margin: 8px auto;
        padding: 15px;
    }

    h1 {
        font-size: 23px;
        margin-bottom: 15px;
    }

    .settings {
        gap: 9px;
    }

    label {
        font-size: 14px;
        margin-bottom: 4px;
    }

    select,
    input[type="number"],
    input[type="text"] {
        padding: 8px;
        font-size: 15px;
    }

    /*
     * Smaller display so there is more room for
     * the answer box on mobile.
     */

    .display {
        margin: 10px 0 10px;
        height: 150px;
        min-height: 150px;
        padding: 10px;
    }

    /*
     * Smaller Japanese character.
     */

    #character {
        font-size: 54px;
    }

    #correctAnswer {
        font-size: 20px;
        margin-top: 6px;
        min-height: 26px;
    }

    #translation {
        font-size: 15px;
        min-height: 22px;
    }

    #inputArea {
        margin-bottom: 12px;

        scroll-margin-top: 10px;
        scroll-margin-bottom: 10px;
    }

    #answer {
        font-size: 20px;
        padding: 9px;
        min-height: 46px;
    }

    .buttons {
        margin-top: 8px;
    }

    .status {
        margin-top: 12px;
        padding: 9px;
    }
}


/* ============================================================
   MOBILE KEYBOARD OPEN
   ============================================================ */

@media (max-width: 700px) and (max-height: 500px) {

    /*
     * The keyboard makes the viewport much shorter.
     * Reduce the overall layout so the textbox remains
     * visible instead of being pushed below the keyboard.
     */

    .app {
        margin: 3px auto;
        padding: 8px;
    }

    /*
     * These aren't necessary while typing and take up
     * valuable vertical space.
     */

    h1,
    .settings {
        display: none;
    }

    /*
     * Smaller display area.
     */

    .display {
        margin: 3px 0 6px;
        height: 105px;
        min-height: 105px;
        padding: 6px;
    }

    /*
     * Smaller Japanese character.
     */

    #character {
        font-size: 46px;
    }

    #correctAnswer {
        font-size: 18px;
        margin-top: 3px;
        min-height: 22px;
    }

    #translation {
        font-size: 13px;
        min-height: 18px;
    }

    #inputArea {
        margin-bottom: 7px;
    }

    /*
     * Keep textbox compact but still easy to tap.
     */

    #answer {
        font-size: 20px;
        min-height: 46px;
        padding: 9px;
    }

    .buttons {
        margin-top: 3px;
    }

    .status {
        margin-top: 5px;
        padding: 6px;
        font-size: 14px;
    }
}

</style>
</head>


<body>

<div class="app">

    <h1>Japanese Reading Practice</h1>


    <!-- ======================================================
         SETTINGS
         ====================================================== -->

    <div class="settings">

        <div>
            <label for="mode">Mode</label>

            <select id="mode">

                <option value="Text Flashing">
                    Text Flashing
                </option>

                <option value="Typing">
                    Typing
                </option>

            </select>
        </div>


        <div>
            <label for="type">Type</label>

            <select id="type">

                <option value="All Alphabets">
                    All Alphabets
                </option>

                <option value="Hiragana">
                    Hiragana
                </option>

                <option value="Katakana">
                    Katakana
                </option>

                <option value="Vocab 1">
                    Vocab 1
                </option>

                <option value="Vocab 2">
                    Vocab 2
                </option>

                <option value="Vocab 3">
                    Vocab 3
                </option>

                <option value="All Vocabs">
                    All Vocabs
                </option>

            </select>
        </div>


        <div>
            <label for="speed">
                Speed (seconds)
            </label>

            <input
                id="speed"
                type="number"
                value="3"
                min="0.5"
                step="0.5"
            >
        </div>


        <div>
            <label for="timer">
                Timer (seconds)
            </label>

            <input
                id="timer"
                type="number"
                value="60"
                min="1"
            >
        </div>

    </div>


    <!-- ======================================================
         DISPLAY
         ====================================================== -->

    <div class="display">

        <div id="character">あ</div>

        <div id="correctAnswer"></div>

        <div id="translation"></div>

    </div>


    <!-- ======================================================
         TYPING INPUT
         ====================================================== -->

    <div id="inputArea">

        <input
            id="answer"
            type="text"
            autocomplete="off"
            autocorrect="off"
            autocapitalize="off"
            spellcheck="false"
            enterkeyhint="done"
            placeholder="Type the reading..."
        >

    </div>


    <!-- ======================================================
         START / STOP
         ====================================================== -->

    <div class="buttons">

        <button id="startButton">
            Start
        </button>

    </div>


    <!-- ======================================================
         STATUS
         ====================================================== -->

    <div class="status">

        <span>
            Time:
            <strong id="time">0</strong>
        </span>

        <span>
            Score:
            <strong id="score">—</strong>
        </span>

    </div>

</div>

let startTime = 0;

let correct = 0;
let total = 0;

let waitingForNext = false;


/* ============================================================
   START
   ============================================================ */

function start() {

    if (running) {
        stop();
        return;
    }


    const speed = getSpeed();

    let timer =
        parseInt(timerElement.value);


    if (
        modeElement.value === "Text Flashing"
    ) {

        if (!timer || timer <= 0) {

            alert(
                "Please enter a valid timer."
            );

            return;
        }
    }


    running = true;

    waitingForNext = false;

    previousCharacter = null;

    correct = 0;
    total = 0;

    startTime = Date.now();


    startButton.textContent = "Stop";

    startButton.classList.add("stop");


    updateScore();


    /*
     * TYPING MODE
     */

    if (
        modeElement.value === "Typing"
    ) {

        inputArea.style.display = "block";

        timeElement.textContent = "∞";

    }


    /*
     * TEXT FLASHING MODE
     */

    else {

        inputArea.style.display = "none";

        timeElement.textContent = timer;
    }


    showNext();


    /*
     * Text Flashing gets a session timer.
     */

    if (
        modeElement.value === "Text Flashing"
    ) {

        sessionTimer =
            setInterval(
                updateSession,
                100
            );


        sessionStopTimer =
            setTimeout(
                () => {

                    if (running) {
                        stop();
                    }

                },
                timer * 1000
            );
    }
}


/* ============================================================
   STOP
   ============================================================ */

function stop() {

    running = false;

    waitingForNext = false;


    clearTimeout(characterTimer);
    clearTimeout(feedbackTimer);
    clearTimeout(sessionStopTimer);

    clearInterval(sessionTimer);


    characterTimer = null;
    feedbackTimer = null;
    sessionStopTimer = null;
    sessionTimer = null;


    startButton.textContent = "Start";

    startButton.classList.remove(
        "stop"
    );


    characterElement.textContent = "—";

    correctAnswerElement.textContent = "";

    translationElement.textContent = "";


    inputArea.style.display = "none";


    answerElement.value = "";

    answerElement.classList.remove(
        "correct",
        "incorrect"
    );


    if (
        modeElement.value === "Text Flashing"
    ) {

        scoreElement.textContent = "—";

    }

    else {

        updateScore();
    }
}


/* ============================================================
   RANDOM CHARACTER
   ============================================================ */

function getRandomCharacter(list) {

    if (list.length <= 1) {
        return list[0];
    }


    let selected;


    do {

        selected =
            list[
                Math.floor(
                    Math.random() * list.length
                )
            ];

    }

    while (
        previousCharacter &&
        selected.c === previousCharacter.c
    );


    return selected;
}


/* ============================================================
   CURRENT LIST
   ============================================================ */

function getCurrentList() {

    switch (
        typeElement.value
    ) {

        case "All Alphabets":

            return [
                ...hiragana,
                ...katakana
            ];


        case "Hiragana":

            return hiragana;


        case "Katakana":

            return katakana;


        case "Vocab 1":

            return vocab1;


        case "Vocab 2":

            return vocab2;


        case "Vocab 3":

            return vocab3;


        case "All Vocabs":

            return [
                ...vocab1,
                ...vocab2,
                ...vocab3
            ];


        default:

            return hiragana;
    }
}


/* ============================================================
   SHOW NEXT
   ============================================================ */

function showNext() {

    if (!running) {
        return;
    }


    clearTimeout(characterTimer);
    clearTimeout(feedbackTimer);


    waitingForNext = false;


    const list =
        getCurrentList();


    currentCharacter =
        getRandomCharacter(list);


    previousCharacter =
        currentCharacter;


    characterElement.textContent =
        currentCharacter.c;


    correctAnswerElement.textContent = "";

    translationElement.textContent = "";


    answerElement.value = "";


    answerElement.classList.remove(
        "correct",
        "incorrect"
    );


    /*
     * TEXT FLASHING
     */

    if (
        modeElement.value === "Text Flashing"
    ) {

        inputArea.style.display = "none";


        characterTimer =
            setTimeout(
                () => {

                    showFlashingAnswer();

                },
                getSpeed() * 1000
            );


        return;
    }


    /*
     * TYPING
     */

    inputArea.style.display = "block";


    answerElement.focus();


    /*
     * Give the mobile browser a moment to
     * open the keyboard before positioning
     * the input area.
     */

    keepTypingAreaVisible();


    characterTimer =
        setTimeout(
            () => {

                /*
                 * Nothing entered before
                 * SPEED expired.
                 */

                if (
                    answerElement.value
                        .trim() === ""
                ) {

                    total++;


                    revealTypingAnswer(
                        false,
                        true
                    );


                    return;
                }


                /*
                 * Automatically check
                 * entered answer.
                 */

                checkAnswer();

            },
            getSpeed() * 1000
        );
}


/* ============================================================
   FLASHING ANSWER
   ============================================================ */

function showFlashingAnswer() {

    if (!running) {
        return;
    }


    correctAnswerElement.textContent =
        currentCharacter.a[0];


    correctAnswerElement.style.color =
        "#22a447";


    if (
        typeElement.value === "Vocab 1" ||
        typeElement.value === "Vocab 2" ||
        typeElement.value === "Vocab 3" ||
        typeElement.value === "All Vocabs"
    ) {

        translationElement.textContent =
            currentCharacter.t || "";

    }

    else {

        translationElement.textContent = "";
    }


    feedbackTimer =
        setTimeout(
            () => {

                if (running) {
                    showNext();
                }

            },
            750
        );
}


/* ============================================================
   CHECK TYPING ANSWER
   ============================================================ */

function checkAnswer() {

    if (
        !running ||
        !currentCharacter
    ) {

        return;
    }


    if (waitingForNext) {
        return;
    }


    clearTimeout(characterTimer);


    const answer =
        answerElement.value
            .trim()
            .toLowerCase();


    if (answer === "") {
        return;
    }


    total++;


    const normalizedAnswer =
        answer
            .replace(/\s+/g, " ")
            .trim();


    const acceptedAnswers =
        currentCharacter.a.map(
            x =>
                x
                    .toLowerCase()
                    .replace(/\s+/g, " ")
                    .trim()
        );


    const isCorrect =
        acceptedAnswers.includes(
            normalizedAnswer
        );


    revealTypingAnswer(
        isCorrect,
        false
    );
}


/* ============================================================
   REVEAL TYPING ANSWER
   ============================================================ */

function revealTypingAnswer(
    isCorrect,
    timedOut
) {

    waitingForNext = true;


    answerElement.classList.remove(
        "correct",
        "incorrect"
    );


    if (isCorrect) {

        correct++;


        answerElement.classList.add(
            "correct"
        );

    }

    else {

        answerElement.classList.add(
            "incorrect"
        );

    }


    correctAnswerElement.textContent =
        currentCharacter.a[0];


    correctAnswerElement.style.color =
        "#22a447";


    if (
        typeElement.value === "Vocab 1" ||
        typeElement.value === "Vocab 2" ||
        typeElement.value === "Vocab 3" ||
        typeElement.value === "All Vocabs"
    ) {

        translationElement.textContent =
            currentCharacter.t || "";

    }

    else {

        translationElement.textContent = "";
    }


    updateScore();
}


/* ============================================================
   KEYBOARD / MOBILE ENTER
   ============================================================ */

answerElement.addEventListener(
    "keydown",
    function(event) {

        /*
         * Once the answer is revealed,
         * Enter moves to the next question.
         */

        if (waitingForNext) {

            if (
                event.key === "Enter" ||
                event.key === "Done"
            ) {

                event.preventDefault();

                showNext();
            }

            return;
        }


        /*
         * Before the answer is revealed,
         * Enter submits the answer.
         */

        if (
            event.key === "Enter" ||
            event.key === "Done"
        ) {

            event.preventDefault();

            checkAnswer();
        }
    }
);


/* ============================================================
   START BUTTON
   ============================================================ */

startButton.addEventListener(
    "click",
    start
);


/* ============================================================
   SPEED
   ============================================================ */

function getSpeed() {

    let speed =
        parseFloat(
            speedElement.value
        );


    if (
        !speed ||
        speed <= 0
    ) {

        speed = 3;

        speedElement.value = 3;
    }


    return speed;
}


/* ============================================================
   SESSION TIMER
   ============================================================ */

function updateSession() {

    /*
     * Only Text Flashing uses TIMER.
     */

    if (
        !running ||
        modeElement.value !== "Text Flashing"
    ) {

        return;
    }


    const timer =
        parseInt(
            timerElement.value
        );


    const elapsed =
        (Date.now() - startTime) / 1000;


    const remaining =
        Math.max(
            0,
            timer - elapsed
        );


    timeElement.textContent =
        Math.ceil(remaining);
}


/* ============================================================
   SCORE
   ============================================================ */

function updateScore() {

    /*
     * Text Flashing has no score.
     */

    if (
        modeElement.value === "Text Flashing"
    ) {

        scoreElement.textContent = "—";

        return;
    }


    /*
     * Typing mode.
     */

    scoreElement.textContent =
        `${correct} / ${total}`;
}


/* ============================================================
   RESET UI
   ============================================================ */

function resetForSelectionChange() {

    /*
     * Changing Mode or Type ALWAYS stops
     * the current game.
     */

    if (running) {
        stop();
    }


    clearTimeout(characterTimer);
    clearTimeout(feedbackTimer);
    clearTimeout(sessionStopTimer);
    clearInterval(sessionTimer);


    characterTimer = null;
    feedbackTimer = null;
    sessionTimer = null;
    sessionStopTimer = null;


    running = false;

    waitingForNext = false;


    /*
     * Reset score.
     */

    correct = 0;
    total = 0;


    /*
     * Clear answer UI.
     */

    correctAnswerElement.textContent = "";

    translationElement.textContent = "";

    answerElement.value = "";

    answerElement.classList.remove(
        "correct",
        "incorrect"
    );


    /*
     * Update mode-specific layout.
     */

    if (
        modeElement.value === "Typing"
    ) {

        inputArea.style.display = "block";

        timeElement.textContent = "∞";

    }

    else {

        inputArea.style.display = "none";

        timeElement.textContent = "0";
    }


    /*
     * Update score.
     */

    updateScore();


    /*
     * Update starting character based
     * on selected Type.
     */

    updatePreviewCharacter();
}


/* ============================================================
   UPDATE PREVIEW CHARACTER
   ============================================================ */

function updatePreviewCharacter() {

    switch (
        typeElement.value
    ) {

        case "Hiragana":

            characterElement.textContent =
                "あ";

            break;


        case "Katakana":

            characterElement.textContent =
                "ア";

            break;


        case "Vocab 1":

            characterElement.textContent =
                "あの";

            break;


        case "Vocab 2":

            characterElement.textContent =
                "これ";

            break;


        case "Vocab 3":

            characterElement.textContent =
                "ビジネス";

            break;


        case "All Vocabs":

            characterElement.textContent =
                "これ";

            break;


        case "All Alphabets":

        default:

            characterElement.textContent =
                "あ";

            break;
    }
}


/* ============================================================
   MODE CHANGE
   ============================================================ */

modeElement.addEventListener(
    "change",
    function() {

        resetForSelectionChange();
    }
);


/* ============================================================
   TYPE CHANGE
   ============================================================ */

typeElement.addEventListener(
    "change",
    function() {

        resetForSelectionChange();
    }
);


/* ============================================================
   MOBILE KEYBOARD POSITIONING
   ============================================================ */

/*
 * Keep the answer area visible when the keyboard
 * opens on a mobile device.
 */

function keepTypingAreaVisible() {

    if (
        window.innerWidth <= 700 &&
        modeElement.value === "Typing" &&
        running
    ) {

        setTimeout(() => {

            if (!running) {
                return;
            }


            inputArea.scrollIntoView({
                behavior: "smooth",
                block: "center"
            });

        }, 150);
    }
}


/*
 * Also reposition when the browser's visual
 * viewport changes because of the keyboard.
 */

if (window.visualViewport) {

    window.visualViewport.addEventListener(
        "resize",
        function() {

            if (
                window.innerWidth <= 700 &&
                modeElement.value === "Typing" &&
                running
            ) {

                setTimeout(() => {

                    if (!running) {
                        return;
                    }


                    inputArea.scrollIntoView({
                        behavior: "smooth",
                        block: "center"
                    });

                }, 100);
            }
        }
    );

}


/* ============================================================
   INITIAL DISPLAY
   ============================================================ */

characterElement.textContent = "あ";

updateScore();

</script>

</html>
