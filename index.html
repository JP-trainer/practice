<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Japanese Practice</title>
<style>
:root{--bg:#f3f1ec;--panel:#fff;--ink:#1f2328;--mute:#6b7280;--line:#e3e0d8;--accent:#c8372d;--ok:#2e9e5b;--okbg:#dff4e6;--bad:#d33c3c;--badbg:#fde3e3}
@media(prefers-color-scheme:dark){:root{--bg:#15171a;--panel:#1f2226;--ink:#eceff3;--mute:#98a1ad;--line:#33373d;--accent:#e65a4f;--ok:#4cc27f;--okbg:#17352440;--bad:#ef6a6a;--badbg:#3a1c1c80}}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI","Hiragino Sans","Noto Sans JP",sans-serif}
.app{width:min(560px,calc(100% - 20px));margin:16px auto;padding:20px;background:var(--panel);border:1px solid var(--line);border-radius:20px}
h1{margin:0 0 16px;font-size:20px;letter-spacing:.02em}
h1 span{color:var(--accent)}
.settings{display:grid;grid-template-columns:1fr 1fr;gap:12px}
label{display:block;margin-bottom:5px;font-size:12px;font-weight:600;color:var(--mute);text-transform:uppercase;letter-spacing:.06em}
select,input{width:100%;padding:10px;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;outline:none}
select:focus,input:focus{border-color:var(--accent)}
input:disabled{opacity:.45}
.card{position:relative;margin:18px 0 14px;min-height:250px;padding:28px 18px 22px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:var(--bg);border:1px solid var(--line);border-radius:16px;overflow:hidden;cursor:default}
.bar{position:absolute;top:0;left:0;height:5px;width:0;background:var(--accent)}
#character{font-size:68px;font-weight:700;line-height:1.15;max-width:100%;overflow-wrap:anywhere}
#correctAnswer{min-height:34px;margin-top:10px;font-size:26px;font-weight:700;color:var(--ok)}
#translation{min-height:24px;margin-top:4px;font-size:17px;color:var(--mute)}
.hint{position:absolute;bottom:8px;font-size:12px;color:var(--mute)}
#answer{margin-bottom:14px;padding:12px;font-size:24px;text-align:center;transition:background-color .2s,border-color .2s}
#answer.correct{background:var(--okbg);border-color:var(--ok)}
#answer.incorrect{background:var(--badbg);border-color:var(--bad)}
button{width:100%;padding:14px;font-size:17px;font-weight:600;color:#fff;background:var(--accent);border:0;border-radius:12px;cursor:pointer}
button.stop{background:#555}
button:active{transform:scale(.99)}
.status{display:flex;justify-content:space-around;margin-top:14px;padding:12px;background:var(--bg);border-radius:12px;font-size:15px;color:var(--mute)}
.status strong{color:var(--ink);font-size:17px}
</style>
</head>
<body>
<div class="app">
  <h1>Japanese <span>Practice</span></h1>

  <div class="settings">
    <div><label for="mode">Mode</label>
      <select id="mode"><option>Text Flashing</option><option>Typing</option></select></div>
    <div><label for="type">Type</label>
      <select id="type"><option>All Alphabets</option><option>Hiragana</option><option>Katakana</option><option>Vocab 1</option><option>Vocab 2</option><option>Vocab 3</option><option>All Vocabs</option></select></div>
    <div><label for="speed">Seconds per card</label>
      <input id="speed" type="number" value="3" min="0.5" step="0.5"></div>
    <div><label for="timer">Session timer (s)</label>
      <input id="timer" type="number" value="60" min="1"></div>
  </div>

  <div class="card" id="card">
    <div class="bar" id="bar"></div>
    <div id="character">あ</div>
    <div id="correctAnswer"></div>
    <div id="translation"></div>
    <div class="hint" id="hint" hidden>Press Enter or tap the card for the next one</div>
  </div>

  <input id="answer" type="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="done" placeholder="Type the romaji…" hidden>

  <button id="startButton">Start</button>

  <div class="status">
    <span>Time <strong id="time">0</strong></span>
    <span>Score <strong id="score">—</strong></span>
  </div>
</div>

<script>
/* ---------- DATA ---------- */
const HIRA = "あいうえおかきくけこさしすせそたちつてとなにぬねのはひふへほまみむめもやゆよらりるれろわをんがぎぐげござじずぜぞだぢづでどばびぶべぼぱぴぷぺぽ";
const KATA = "アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワヲンガギグゲゴザジズゼゾダヂヅデドバビブベボパピプペポ";
const ROM = "a i u e o ka ki ku ke ko sa shi/si su se so ta chi/ti tsu/tu te to na ni nu ne no ha hi fu/hu he ho ma mi mu me mo ya yu yo ra ri ru re ro wa wo/o n/nn ga gi gu ge go za ji/zi zu ze zo da ji/di zu/du de do ba bi bu be bo pa pi pu pe po".split(" ");
const kana = s => [...s].map((c, i) => ({ c, a: ROM[i].split("/") }));
const vocab = s => s.trim().split("\n").map(l => { const [c, a, t] = l.split("|"); return { c, a: a.split("/"), t }; });

const hiragana = kana(HIRA), katakana = kana(KATA);

const vocab1 = vocab(`
あの|ano|um...
いま|ima|now
えいご|eigo|English (language)
ええ、はい|ee hai|yes
がくせい|gakusei|student
ご|go|...language
こうこう|koukou|high school
ごご|gogo|P.M.
ごぜん|gozen|A.M.
さい|sai|...years old
さん|san|Mr. or Mrs....
じ|ji|time; o'clock
じん|jin|...people
せんこう|senkou|major
せんせい|sensei|teacher; Professor...
そうです|sou desu|That's right.
だいがく|daigaku|college; university
でんわ|denwa|phone
ともだち|tomodachi|friend
なまえ|namae|name
なん、なに|nan nani|what
にほん|nihon|Japan
ねんせい|nensei|...year student
はん|han|half
ばんごう|bangou|number
りゅうがくせい|ryuugakusei|international student
わたし|watashi|I; me; myself`);

const vocab2 = vocab(`
これ|kore|this one
それ|sore|that one
あれ|are|that one (over there)
どれ|dore|which one
この|kono|this...
その|sono|that...
あの|ano|that... (over there)
どの|dono|which...
あそこ|asoko|over there
どこ|doko|where
だれ|dare|who
おいしい|oishii|delicious
さかな|sakana|fish
とんかつ|tonkatsu|pork cutlet
にく|niku|meat
メニュー|menyuu|menu
やさい|yasai|vegetable
えんぴつ|enpitsu|pencil
かさ|kasa|umbrella
かばん|kaban|bag
くつ|kutsu|shoes
さいふ|saifu|wallet
ジーンズ|jiinzu|jeans
じしょ|jisho|dictionary
じてんしゃ|jitensha|bicycle
しんぶん|shinbun|newspaper
テープ|teepu|tape
トレーナー|toreenaa|sweat shirt
ノート|nooto|notebook
ペン|pen|pen
ぼうし|booshi|hat
ほん|hon|book
おてあらい|otearai|restroom
ぎんこう|ginkoo|bank
としょかん|toshokan|library
ゆうびんきょく|yuubinkyoku|post office
アメリカ|amerika|USA
イギリス|igirisu|Britain
かんこく|kankoku|Korea
ちゅうごく|chuugoku|China
けいざい|keezai|economics
コンピューター|konpyuutaa|computer
ビジネス|bijinesu|business
れきし|rekishi|history
おかあさん|okaasan|mother
おとうさん|otoosan|father
いくら|ikura|how much
えん|en|yen
たかい|takai|expensive
いらっしゃいませ|irasshaimase|welcome
おねがいします|onegaishimasu|please
ください|kudasai|please
きっさてん|kissaten|cafe`);

const vocab3 = vocab(`
ビジネス|bijinesu|Business
えいが|eiga|Movie
おんがく|ongaku|Music
スポーツ|supootsu|Sports
はなす|hanasu|To speak; to talk
テレビ|terebi|TV
あさごはん|asagohan|Breakfast
さけ|sake|Sake; alcohol
おちゃ|ocha|Green Tea
コーヒー|koohii|Coffee
ひるごはん|hirugohan|Lunch
ばんごはん|bangohan|Dinner
みず|mizu|Water
いえ|ie|Home; house
きょう|kyou|Today
あした|ashita|Tomorrow
こんばん|konban|Tonight
まいにち|mainichi|Every day
いく|iku|To go
かえる|kaeru|To go back; to return
きく|kiku|To listen; to hear
おきる|okiru|To get up
たべる|taberu|To eat
ねる|neru|To sleep; to go to sleep
みる|miru|To see; to look at; to watch
べんきょうする|benkyou suru|To study
ぜんぜん|zenzen|Not at all
ときどき|tokidoki|Sometimes
よく|yoku|Often; much
する|suru|To do
よむ|yomu|To read`);

const seen = new Set();
const allVocabs = [...vocab1, ...vocab2, ...vocab3].filter(x => {
  const k = x.c + x.t.toLowerCase();
  return seen.has(k) ? false : seen.add(k);
});

const LISTS = {
  "All Alphabets": [...hiragana, ...katakana],
  "Hiragana": hiragana, "Katakana": katakana,
  "Vocab 1": vocab1, "Vocab 2": vocab2, "Vocab 3": vocab3,
  "All Vocabs": allVocabs
};

/* ---------- ELEMENTS ---------- */
const $ = id => document.getElementById(id);
const modeEl = $("mode"), typeEl = $("type"), speedEl = $("speed"), timerEl = $("timer");
const charEl = $("character"), ansEl = $("correctAnswer"), transEl = $("translation");
const answer = $("answer"), startBtn = $("startButton"), timeEl = $("time"), scoreEl = $("score");
const bar = $("bar"), hint = $("hint"), card = $("card");

/* ---------- STATE ---------- */
let running = false, waiting = false;
let current = null, previous = null, deck = [];
let charTimer, fbTimer, stopTimer, tick;
let startTime = 0, correct = 0, total = 0;
let missed = new Map();

const isTyping = () => modeEl.value === "Typing";
const getList = () => LISTS[typeEl.value] || hiragana;

function getSpeed() {
  let s = parseFloat(speedEl.value);
  if (!s || s <= 0) { s = isTyping() ? 8 : 3; speedEl.value = s; }
  return s;
}

/* ---------- ANSWER MATCHING ---------- */
// Lenient: ignores spaces/punctuation, and treats ou/oo and ei/ee as equal.
const normalize = s => s.toLowerCase()
  .replace(/ō/g, "oo").replace(/ū/g, "uu")
  .replace(/[^a-z]/g, "")
  .replace(/ou/g, "oo").replace(/ei/g, "ee");

/* ---------- DECK (shuffled, no repeats until all seen) ---------- */
function draw() {
  if (!deck.length) {
    deck = [...getList()];
    for (let i = deck.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [deck[i], deck[j]] = [deck[j], deck[i]];
    }
    if (deck.length > 1 && previous && deck[deck.length - 1].c === previous.c) deck.unshift(deck.pop());
  }
  return deck.pop();
}

/* ---------- PROGRESS BAR ---------- */
function runBar(sec) {
  bar.style.transition = "none"; bar.style.width = "100%";
  void bar.offsetWidth;
  bar.style.transition = `width ${sec}s linear`; bar.style.width = "0";
}
function resetBar() { bar.style.transition = "none"; bar.style.width = "0"; }

/* ---------- FLOW ---------- */
function start() {
  if (running) return stop();
  const timer = parseInt(timerEl.value);
  if (!isTyping() && (!timer || timer <= 0)) { alert("Please enter a valid timer."); return; }

  running = true; waiting = false; previous = null; deck = [];
  correct = 0; total = 0; missed.clear(); startTime = Date.now();
  startBtn.textContent = "Stop"; startBtn.classList.add("stop");
  answer.hidden = !isTyping();
  timeEl.textContent = isTyping() ? "∞" : timer;
  updateScore();
  showNext();

  if (!isTyping()) {
    tick = setInterval(updateSession, 100);
    stopTimer = setTimeout(() => running && stop(), timer * 1000);
  }
}

function stop() {
  const wasRunning = running;
  running = false; waiting = false;
  clearTimeout(charTimer); clearTimeout(fbTimer); clearTimeout(stopTimer); clearInterval(tick);
  resetBar();
  startBtn.textContent = "Start"; startBtn.classList.remove("stop");
  charEl.textContent = "—"; ansEl.textContent = ""; hint.hidden = true;
  transEl.textContent = wasRunning && missed.size
    ? "Review: " + [...missed.values()].join("   ") : "";
  answer.hidden = true; answer.value = ""; answer.className = "";
  timeEl.textContent = isTyping() ? "∞" : "0";
  updateScore();
}

function showNext() {
  if (!running) return;
  clearTimeout(charTimer); clearTimeout(fbTimer);
  waiting = false; hint.hidden = true;

  current = draw(); previous = current;
  charEl.textContent = current.c;
  ansEl.textContent = ""; transEl.textContent = "";
  answer.value = ""; answer.className = "";

  const sec = getSpeed();
  runBar(sec);

  if (isTyping()) {
    answer.hidden = false; answer.focus();
    charTimer = setTimeout(() => {
      if (answer.value.trim() === "") { total++; reveal(false); }
      else checkAnswer();
    }, sec * 1000);
  } else {
    charTimer = setTimeout(showFlashingAnswer, sec * 1000);
  }
}

function showFlashingAnswer() {
  if (!running) return;
  total++; updateScore();
  ansEl.textContent = current.a[0];
  transEl.textContent = current.t || "";
  resetBar();
  fbTimer = setTimeout(() => running && showNext(), 900);
}

function checkAnswer() {
  if (!running || !current || waiting) return;
  const val = answer.value.trim();
  if (!val) return;
  clearTimeout(charTimer);
  total++;
  const n = normalize(val);
  reveal(current.a.some(x => normalize(x) === n));
}

function reveal(ok) {
  waiting = true;
  resetBar();
  answer.className = ok ? "correct" : "incorrect";
  if (ok) correct++;
  else {
    missed.set(current.c + current.a[0], `${current.c} (${current.a[0]})`);
    // bring it back in a few cards
    deck.splice(Math.max(0, deck.length - 3 - Math.floor(Math.random() * 3)), 0, current);
  }
  ansEl.textContent = current.a[0];
  transEl.textContent = current.t || "";
  hint.hidden = false;
  updateScore();
}

/* ---------- STATUS ---------- */
function updateSession() {
  if (!running || isTyping()) return;
  const left = Math.max(0, parseInt(timerEl.value) - (Date.now() - startTime) / 1000);
  timeEl.textContent = Math.ceil(left);
}

function updateScore() {
  if (isTyping()) {
    const pct = total ? ` (${Math.round(correct / total * 100)}%)` : "";
    scoreEl.textContent = `${correct} / ${total}${pct}`;
  } else {
    scoreEl.textContent = total ? `${total} cards` : "—";
  }
}

/* ---------- SETTINGS ---------- */
function save() {
  try { localStorage.setItem("jp-practice", JSON.stringify({ m: modeEl.value, t: typeEl.value, s: speedEl.value, r: timerEl.value })); } catch (e) {}
}

function syncUI() {
  timerEl.disabled = isTyping();
  charEl.textContent = getList()[0].c;
  ansEl.textContent = ""; transEl.textContent = "";
  answer.hidden = true; answer.value = ""; answer.className = "";
  timeEl.textContent = isTyping() ? "∞" : "0";
  correct = 0; total = 0; deck = [];
  updateScore();
}

function onSelectionChange() {
  if (running) stop();
  syncUI(); save();
}

modeEl.addEventListener("change", () => {
  speedEl.value = isTyping() ? 8 : 3;   // typing needs more time per card
  onSelectionChange();
});
typeEl.addEventListener("change", onSelectionChange);
speedEl.addEventListener("change", save);
timerEl.addEventListener("change", save);

/* ---------- INPUT ---------- */
startBtn.addEventListener("click", start);

answer.addEventListener("keydown", e => {
  if (e.key !== "Enter" && e.key !== "Done") return;
  e.preventDefault();
  waiting ? showNext() : checkAnswer();
});

card.addEventListener("click", () => { if (running && waiting) showNext(); });
document.addEventListener("keydown", e => { if (e.key === "Escape" && running) stop(); });

/* ---------- INIT ---------- */
try {
  const s = JSON.parse(localStorage.getItem("jp-practice") || "null");
  if (s) { modeEl.value = s.m; typeEl.value = s.t; speedEl.value = s.s; timerEl.value = s.r; }
} catch (e) {}
if (!LISTS[typeEl.value]) typeEl.value = "All Alphabets";
syncUI();
</script>
</body>
</html>
